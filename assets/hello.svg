<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Hello, I'm Ioanna. I build systems that notice what people miss.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFEFF4"/>
      <stop offset="0.55" stop-color="#F0EAFF"/>
      <stop offset="1" stop-color="#E6F6EC"/>
    </linearGradient>
    <clipPath id="frame"><circle cx="170" cy="150" r="112"/></clipPath>
    <path id="spark" d="M0 -11 Q1.6 -1.6 11 0 Q1.6 1.6 0 11 Q-1.6 1.6 -11 0 Q-1.6 -1.6 0 -11Z"/>
  </defs>

  <rect width="1000" height="300" rx="28" fill="url(#bg)"/>

  <!-- avatar -->
  <circle cx="170" cy="150" r="118" fill="#FFFFFF"/>
  <circle cx="170" cy="150" r="112" fill="#D8CCFB"/>
  <g clip-path="url(#frame)">
    <!-- hair, back -->
    <path d="M88 156 C86 94 122 60 170 60 C218 60 254 94 252 156 L258 280 L82 280 Z" fill="#EFC244"/>
    <!-- neck and sweater -->
    <rect x="155" y="194" width="30" height="36" rx="12" fill="#F9D2BB"/>
    <path d="M96 280 C96 238 130 220 170 220 C210 220 244 238 244 280 Z" fill="#8B7BE8"/>
    <path d="M152 221 Q170 240 188 221" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
    <!-- face -->
    <ellipse cx="170" cy="154" rx="57" ry="55" fill="#FFE5D5"/>
    <!-- hair, front locks -->
    <path d="M112 130 C98 172 98 232 106 280 L130 280 C119 250 114 216 116 190 C113 174 112 150 112 130 Z" fill="#F7D35C"/>
    <path d="M228 130 C242 172 242 232 234 280 L210 280 C221 250 226 216 224 190 C227 174 228 150 228 130 Z" fill="#F7D35C"/>
    <!-- fringe -->
    <path d="M110 152 C104 100 136 74 170 74 C204 74 236 100 230 152 C222 128 208 112 190 104 C176 124 146 136 110 152 Z" fill="#F7D35C"/>
    <path d="M150 84 C164 78 184 80 196 90" fill="none" stroke="#FFE99A" stroke-width="5" stroke-linecap="round"/>
    <!-- brows -->
    <path d="M139 138 Q148 133 157 137" fill="none" stroke="#C99A1E" stroke-width="3" stroke-linecap="round"/>
    <path d="M183 137 Q192 133 201 138" fill="none" stroke="#C99A1E" stroke-width="3" stroke-linecap="round"/>
    <!-- eyes -->
    <ellipse cx="148" cy="160" rx="11" ry="13" fill="#34A066"/>
    <ellipse cx="192" cy="160" rx="11" ry="13" fill="#34A066"/>
    <ellipse cx="148" cy="161" rx="5.5" ry="7.5" fill="#15452B"/>
    <ellipse cx="192" cy="161" rx="5.5" ry="7.5" fill="#15452B"/>
    <circle cx="144" cy="155" r="3.6" fill="#FFFFFF"/>
    <circle cx="188" cy="155" r="3.6" fill="#FFFFFF"/>
    <circle cx="152" cy="166" r="1.8" fill="#BDF0D2"/>
    <circle cx="196" cy="166" r="1.8" fill="#BDF0D2"/>
    <path d="M135 153 Q147 143 160 151" fill="none" stroke="#3A2A1A" stroke-width="3" stroke-linecap="round"/>
    <path d="M180 151 Q193 143 205 153" fill="none" stroke="#3A2A1A" stroke-width="3" stroke-linecap="round"/>
    <!-- blush and smile -->
    <ellipse cx="131" cy="180" rx="10" ry="5.5" fill="#FF9DB3" opacity="0.6"/>
    <ellipse cx="209" cy="180" rx="10" ry="5.5" fill="#FF9DB3" opacity="0.6"/>
    <path d="M160 184 Q170 194 180 184" fill="none" stroke="#D95F78" stroke-width="3.2" stroke-linecap="round"/>
    <!-- hair clip -->
    <path d="M214 112 c-5 -7 -15 -1 -10 7 c3 5 10 9 10 9 c0 0 7 -4 10 -9 c5 -8 -5 -14 -10 -7Z" fill="#FF7FA3"/>
  </g>

  <!-- sparkles -->
  <use href="#spark" x="296" y="64" fill="#F7B6C8">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.6s" repeatCount="indefinite"/>
  </use>
  <use href="#spark" x="930" y="70" fill="#B9A8F5">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/>
  </use>
  <use href="#spark" x="952" y="238" fill="#8FD3AB" transform="translate(381 95) scale(0.6)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/>
  </use>

  <!-- text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="322" y="126" font-size="58" font-weight="800" fill="#2B2440" letter-spacing="-1">Hello, I'm Ioanna</text>
    <text x="324" y="170" font-size="23" fill="#5A5174">I build systems that notice what people miss.</text>

    <g font-size="15" font-weight="600" text-anchor="middle">
      <rect x="324" y="204" width="164" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.85"/>
      <text x="406" y="227" fill="#6B55D9">Machine Learning</text>
      <rect x="500" y="204" width="156" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.85"/>
      <text x="578" y="227" fill="#C2456B">Computer Vision</text>
      <rect x="668" y="204" width="146" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.85"/>
      <text x="741" y="227" fill="#23804F">Neural Signals</text>
      <rect x="826" y="204" width="112" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.85"/>
      <text x="882" y="227" fill="#6B55D9">Full Stack</text>
    </g>
  </g>
</svg>
